name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep the classroom notebook isolated from the main workspace. Pin the
      # tested prototype release so later experiments cannot change the site.
      - name: Check out the notebook release
        uses: actions/checkout@v4
        with:
          ref: 97ca9431fec981aa55a563925f8c4845f21e1514
          path: notebook-release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test notebook release
        run: npm test
        working-directory: notebook-release
      - name: Add the separate notebook page
        run: |
          mkdir -p dist/notebook
          cp -R notebook-release/dist/. dist/notebook/
          cp notebook-release/dist/notebook.html dist/notebook/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
