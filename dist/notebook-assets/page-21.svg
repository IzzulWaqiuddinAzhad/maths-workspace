t x="651.998779296875" y="104" font-family="Arial, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#17191c">-2</text><text x="653.497314453125" y="114.35" font-family="Arial, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#17191c">3</text><text x="665" y="109.4" font-family="Arial, sans-serif" font-size="20.7" font-weight="400" font-style="normal" fill="#17191c">)</text><text x="467" y="138" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" font-style="normal" fill="#17191c">Transformasi P ialah pantulan pada garis y = −x.</text><text x="467" y="151.59" font-family="Arial, sans-serif" font-size="8.5" font-weight="400" font-style="italic" fill="#5b6068">Transformation P is a reflection in the line y = −x.</text><text x="467" y="165.96" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" font-style="normal" fill="#17191c">Tentukan koordinat imej bagi titik A di bawah gabungan transformasi TP.</text><text x="467" y="179.55" font-family="Arial, sans-serif" font-size="8.5" font-weight="400" font-style="italic" fill="#5b6068">Determine the coordinates of the image of point A under the combined transformation TP.</text><text x="747.901611328125" y="193.92000000000002" font-family="Arial, sans-serif" font-size="7.5" font-weight="400" font-style="normal" fill="#5b6068">[2 markah / marks]</text><text x="443" y="267" font-family="Arial, sans-serif" font-size="10" font-weight="700" font-style="normal" fill="#17191c">(b)</text><text x="467" y="267" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" font-style="normal" fill="#17191c">JKLM ialah imej bagi ABCD di bawah gabungan transformasi ZY. Huraikan</text><text x="467" y="278.59" font-family="Arial, sans-serif" font-size="9.5" font-weight="400" font-style="normal" fill="#17191c">selengkapnya transformasi berikut.</text><text x="467" y="292.17999999999995" font-family="Arial, sans-serif" font-size="8.5" font-weight="400" font-style="italic